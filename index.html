<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="会员管家">
<meta name="theme-color" content="#0b0d14">
<meta name="description" content="集中管理腾讯视频、爱奇艺、美团等各类互联网会员订阅">
<title>会员管家 · Membership Tracker</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="app" id="app">

    <!-- 状态栏 -->
    <div class="statusbar">
      <span class="sb-time" id="sbTime">9:41</span>
      <span class="sb-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 9.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3z" transform="translate(0,-2)"/><path d="M8 5.5c1.5 0 2.9.6 3.9 1.6l1.1-1.1A7 7 0 008 4a7 7 0 00-5 2l1.1 1.1A5.5 5.5 0 018 5.5z" transform="translate(0,0)"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2 2 0 000-4z" fill="currentColor" opacity="0.4"/></svg>
      </span>
    </div>

    <!-- 顶部内容区（每个 tab 渲染于此） -->
    <main class="screen" id="screen"></main>

    <!-- 底部 Tab Bar -->
    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/></svg>
        <span>概览</span>
      </button>
      <button class="tab" data-tab="list">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>
        <span>会员</span>
      </button>
      <button class="tab tab-add" data-tab="add">
        <span class="add-btn">＋</span>
      </button>
      <button class="tab" data-tab="stats">
        <svg viewBox="0 0 24 24"><path d="M5 20V10h3v10H5zm5.5 0V4h3v16h-3zM16 20v-7h3v7h-3z"/></svg>
        <span>统计</span>
      </button>
      <button class="tab" data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9L5.3 5.3" stroke-linecap="round"/></svg>
        <span>我的</span>
      </button>
    </nav>
  </div>
</div>

<!-- 底部抽屉 / 弹层挂载点 -->
<div class="sheet-mask" id="sheetMask"></div>
<div class="sheet" id="sheet"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
